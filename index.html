    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: linear-gradient(135deg, #0a1628 0%, #0f1f2e 100%); color: white; overflow-x: hidden; }
        h2 { font-family: 'Playfair Display', serif; }
        
        .fade-in-up { animation: fadeInUp 0.8s ease-out forwards; opacity: 0; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pulse-ws {
            box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            70% { box-shadow: 0 0 0 15px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Caribbean colors enhancement */
        .caribbean-accent { color: #00D9FF; }
        .caribbean-warm { color: #F5A623; }

    <style>
      #page-loader {
        position: fixed; inset: 0; z-index: 9999;
        background: #050a15;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 20px;
        transition: opacity 0.4s ease;
      }
      #page-loader.fade-out { opacity: 0; pointer-events: none; }
      .loader-logo {
        width: 90px; height: 90px;
        display: flex; align-items: center; justify-content: center;
        animation: loader-pulse 1.8s ease-in-out infinite;
        transform-origin: center center;
      }
      .loader-logo img {
        width: 90px; height: 90px;
        object-fit: contain;
      }
      .loader-text {
        color: rgba(255,255,255,0.6);
        font-family: sans-serif;
        font-size: 0.85rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .loader-fact {
        max-width: 320px;
        text-align: center;
        color: rgba(255,255,255,0.85);
        font-family: sans-serif;
        font-size: 0.92rem;
        line-height: 1.5;
        padding: 0 20px;
        animation: fact-fade-in 0.6s ease;
      }
      .loader-fact-label {
        font-size: 0.7rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #00D9FF;
        margin-bottom: 6px;
        font-weight: 600;
      }
      @keyframes fact-fade-in {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes loader-pulse {
        0%, 100% { transform: scale(1);   opacity: 1; }
        50%       { transform: scale(1.12); opacity: 0.75; }
      }
    </style>
    <script>

          "🏖️ Punta Cana recibe más de 8 millones de turistas al año.",

          "🗺️ Hispaniola es la segunda isla más grande del Caribe.",
          "🏙️ Santo Domingo fue la primera ciudad europea fundada en América, en 1496.",

          "🎶 La bachata, uno de los géneros más escuchados en el mundo, es 100% dominicana.",
          "🌡️ El clima promedio del país es de 25°C todo el año. ¡Eterno verano!",
          "🦎 El iguana rinoceronte es una especie única que solo vive en La Española.",
          "💎 El larimar, la piedra semipreciosa azul cielo, solo se encuentra en RD.",
          "☕ El café dominicano fue nombrado uno de los mejores del mundo por expertos en 2023.",
          "🌊 La playa Montaña Redonda tiene el columpio más famoso sobre el mar en el Caribe.",
          "🎉 El Carnaval dominicano se celebra todo el mes de febrero con cientos de máscaras.",
          "🐢 En las playas de Pedernales anidan tortugas marinas en peligro de extinción.",
          "🌿 Los Haitises es uno de los bosques tropicales húmedos mejor conservados del Caribe.",
          "🗿 Los taínos dejaron miles de petroglifos en cuevas de todo el país.",
          "🏄 Cabarete es reconocida como capital mundial del kite surf y el windsurf.",

          "🏔️ Más del 30% del territorio dominicano está protegido como área natural."

          var factEl = document.getElementById('loader-fact-text');
          if (factEl) factEl.textContent = facts[idx];
        });
      })();
    </script>
